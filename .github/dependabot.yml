version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@types/node'
    commit-message:
      prefix: 'chore(deps): ⬆️'

  - package-ecosystem: composer
    directory: /test/fixtures/laravel
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps): ⬆️'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps): ⬆️'
