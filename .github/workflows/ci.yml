name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install Laravel test dependencies
        run: composer install --working-dir=test/fixtures/laravel --no-scripts --no-plugins --no-interaction --prefer-dist --no-progress
      - name: Install PHPantom 0.11.1
        run: |
          mkdir -p "$RUNNER_TEMP/phpantom"
          curl --fail --silent --show-error --location \
            https://github.com/PHPantom-dev/phpantom_lsp/releases/download/0.11.1/phpantom_lsp-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/phpantom.tar.gz"
          tar -xzf "$RUNNER_TEMP/phpantom.tar.gz" -C "$RUNNER_TEMP/phpantom"
          echo "$RUNNER_TEMP/phpantom" >> "$GITHUB_PATH"
      - run: pnpm check
      - run: pnpm test:integration
